<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>摩尔庄园</title>
<style>
  /* ==================================================================
     屏幕适配（第二版，修复「画面放大、UI 被裁切」）
     ------------------------------------------------------------------
     上一版把播放器元素撑满视口、指望 Ruffle 的 scale=showAll 去适配。
     实测不行：AS3 游戏几乎都会在运行时自己改 stage.scaleMode（常见
     NO_SCALE / EXACT_FIT），一旦它改成 NO_SCALE，舞台就按 960x560
     的原始坐标 1:1 贴到元素上，视口比舞台小 → 右侧和底部被裁掉，
     表现就是「画面被放大、部分 UI 被遮挡」。

     正确姿势（本版）：让播放器元素**严格等于影片原生尺寸**（默认
     960x560，运行时按 metadata 校正），再用 CSS transform 等比缩放
     整个容器去适配屏幕（contain：完整可见、居中、多余部分留黑边）。
     这样 scaleMode 是什么都不重要 —— 元素尺寸 = 舞台尺寸 = 设计稿
     尺寸，和官方电脑微端窗口里的呈现完全一致；手机 / 平板 / 安卓
     x86 桌面只是整体缩放比例与黑边宽窄不同，永远不裁切、不变形。
     ================================================================== */
  html,body{margin:0;padding:0;border:0;width:100%;height:100%;background:#000;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;        /* 长按不弹「存储图片 / 打开链接」气泡，否则会吞掉一次点击 */
    overscroll-behavior:none;          /* 阻断下拉刷新 / 边缘回弹，否则上滑会被 WebView 抢走 */
    touch-action:none;}
  #wrap{position:fixed;left:50%;top:50%;
    width:960px;height:560px;                 /* 运行时按影片实际分辨率校正 */
    transform:translate(-50%,-50%) scale(var(--f,1));
    transform-origin:50% 50%;background:#000;
    /* 触摸事件在这一层就吃掉，别让它冒泡到 WebView 的滚动/缩放手势识别器 */
    touch-action:none;-webkit-user-select:none;user-select:none;}
  #wrap > *{display:block;width:100%!important;height:100%!important;margin:0!important;padding:0!important;}
  ruffle-player,ruffle-embed,ruffle-object{display:block;width:100%!important;height:100%!important;background:#000;}
  /* 播放器内部可能出现的 canvas / 中间层统一铺黑底。
     用途只有一个：GPU 上下文重建（显存吃紧时驱动会先丢上下文再崩）的那一瞬，
     透明画布会被合成器按默认底色呈现 —— 也就是用户看到的「一闪而过的白光」。
     给它一个黑底，同一瞬间看起来就只是黑了一帧，不会刺眼。 */
  #wrap canvas,#wrap video{background:#000;}
  #hud{position:fixed;left:0;right:0;bottom:0;max-height:46vh;overflow:auto;
    font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#7f7;
    background:rgba(0,0,0,.78);padding:6px 8px;z-index:2147483646;
    white-space:pre-wrap;word-break:break-all;display:none;}
  #hud.on{display:block;}

  /* ---- 虚拟触控板图层（OmniPad，见第 5 段） ----
     默认 pointer-events:none，空白处一律穿透；
     只有 OmniPad 自己的 .omnipad-target-zone / .omnipad-button-base 是 auto。 */
  #pad{position:fixed;left:0;top:0;width:100%;height:100%;z-index:9;
    pointer-events:none;touch-action:none;}
  /* 触控板压暗一点、通透一点，别抢游戏画面的注意力 */
  #pad .omnipad-trackpad{opacity:.92;
    --omnipad-trackpad-bg:rgba(0,0,0,.45);
    --omnipad-btn-border-color:rgba(255,255,255,.42);
    --omnipad-btn-label-color:rgba(255,255,255,.9);
    --omnipad-btn-font-size:13px;
    --omnipad-btn-font-family:system-ui,-apple-system,"PingFang SC",sans-serif;}
  /* ---- 触控板视觉隐藏（1.0.6）----
     右下角那块板子会压住游戏画面，这里让它彻底看不见。
     用 opacity:0 而**不是** display:none / visibility:hidden：
     后两者会连带退出命中测试，拖动手势当场失效；而 opacity:0
     的元素照样接收 pointer 事件，所以「看不见」但「手感一点没变」。
     只作用于 .omnipad-trackpad 本身，靶区（TargetZone）与虚拟光标不受影响，
     点哪走哪、悬停菜单照旧。想恢复外观：__molePad.trackpad('on')。 */
  #pad.pad-invisible .omnipad-trackpad{opacity:0!important;}
</style>

<body>
<div id="wrap"></div>
<div id="hud"></div>
<script>
/* ==================================================================
 * 0) 帧率节流器 —— 必须在 ruffle.js **之前**装载
 * ==================================================================
 * 问题（用户实测反馈：「小游戏跟开了倍速一样」）
 * ------------------------------------------------
 * 解析淘米 SWF 文件头得到的真实帧率：
 *     Client.swf                     FR=24.0
 *     WordMapMainPanel.swf           FR=24.0
 *     Map_10015.swf                  FR=24.0
 *     lamubone.swf                   FR=24.0
 * 而 Ruffle 自己也认到了：metadata.frameRate = 24。
 *
 * 但实测本页 requestAnimationFrame 的中位间隔是 17ms（≈58.8 Hz），
 * 也就是屏幕给的是 60Hz 的推进节奏。两者一除：
 *     58.8 / 24 ≈ 2.45
 * 正好对上「开了倍速」的体感 —— 说明 Ruffle 的时间累加没起到限速作用，
 * 逻辑帧实际上是跟着屏幕刷新率在跑。
 *
 * 注意这些 SWF 都是 numFrames=1 的「资源库」型文件（只放位图/元件，
 * 时间轴不推进），游戏逻辑全靠 ENTER_FRAME 驱动 —— 一旦 ENTER_FRAME
 * 变成每屏刷一次而不是每 SWF 帧一次，所有小游戏、走路的 NPC、
 * 计时器就一起快 2.5 倍，和用户描述的现象完全一致。
 *
 * 做法：把 rAF 改成「按累积时间放行」——
 * 原生 rAF 仍然 60Hz 触发，但只有当累积时间够一个 SWF 帧长（1000/24 ms）
 * 才真正把回调放出去。这样：
 *   · 若 Ruffle 内部用 performance.now() 算 dt（正确实现）→ 逻辑帧率不变，
 *     只是渲染调用变少，纯赚；
 *   · 若 Ruffle 是按 rAF 次数推进（当前实际情形）→ 逻辑帧率被拉回 24。
 * 两种情况都收敛到 SWF 的真实帧率，不会更糟。
 *
 * 传给回调的时间戳仍是原生高精度戳，不做任何加工，避免 Ruffle
 * 的 dt 计算被我们的节流污染。
 * ================================================================== */
(function () {
  var TARGET_FPS = 24;              // = SWF 真实帧率，可被 __moleSetFps 改
  var FRAME_MS = 1000 / TARGET_FPS;
  var nativeRaf = window.requestAnimationFrame.bind(window);
  var queue = new Map();
  var seq = 0;
  var acc = 0;
  var lastTs = 0;

  window.requestAnimationFrame = function (cb) {
    var id = ++seq;
    queue.set(id, cb);
    return id;
  };
  window.cancelAnimationFrame = function (id) {
    queue.delete(id);
  };

  /* ------------------------------------------------------------------
   * 时间轴钳制（1.0.5）——「切后台回来被服务器踢」的对症修复
   * ---------------------------------------------------------------
   * 现象（群友反馈）：把游戏切到后台，再回来时服务器收到**大量时间顺序
   *   对不上的异常数据包**，随即被踢下线。
   *
   * 根因（已核对 Ruffle 源码）：
   *   web/src/lib.rs:1220   dt = 本次 rAF 时间戳 − 上次 rAF 时间戳
   *   core/src/player.rs:550  frame_accumulator += dt，然后
   *                           while (frame < max_frames_per_tick=5) run_frame()
   *   切后台时 Java 侧执行了 WebView.onPause() + pauseTimers()，rAF 彻底
   *   停摆；回来时第一个时间戳已经是几分钟之后 → dt = 挂起时长。于是：
   *     · 一次 tick 连跑 5 帧（"补帧风暴"）
   *     · update_timers(dt) 把所有 setInterval 一次性补跑
   *     · 影片全局时钟（getTimer）凭空前进几分钟
   *   游戏在这几帧里把积压逻辑全做了一遍，每个包都带着跳变后的时间戳
   *   发出去 —— 服务器看到的就是「时间倒挂 / 顺序错乱」的一串包。
   *
   * 做法：**只改喂给 Ruffle 的时间戳，不碰任何真实计时**。
   *   · 平时虚拟时钟与真实时间 1:1 前进，一毫秒不差；
   *   · 单次推进超过 MAX_STEP_MS（250ms ≈ 6 帧）就截断 —— 真实掉帧
   *     很难到这个量级，到了也说明这一帧已经废了，截断只会更稳；
   *   · 超过 RESUME_GAP_MS（800ms）判定为后台恢复：只推进 1 帧，
   *     让游戏从挂起处平滑接上，不补帧、不补定时器。
   *   帧率 / 画质 / 节流器 / 画幅一律不参与，仍是 24fps。
   * ------------------------------------------------------------------ */
  var MAX_STEP_MS = 250;
  var RESUME_GAP_MS = 800;
  var vTs = 0;              // 虚拟时间轴（唯一喂给 Ruffle 的时间戳）
  var lastReal = 0;
  var stallMs = 0;          // 累计被切掉的时间（诊断用）
  var resumeN = 0;
  var lastNoteAt = 0;
  var pendingAlign = false; // 后台由 Ruffle 自己跑过 → 回来时对齐真实时间
  var alignN = 0;

  function dispatch(v) {
    var cbs = [];
    queue.forEach(function (f) { cbs.push(f); });
    queue.clear();
    for (var i = 0; i < cbs.length; i++) {
      try { cbs[i](v); } catch (e) {}
    }
  }

  function pump(ts) {
    nativeRaf(pump);
    if (!lastTs) { lastTs = ts; lastReal = ts; vTs = ts; return; }

    /* 后台跑过一程再回来：直接对齐，不钳制。
       ---------------------------------------------------------------
       1.0.6 起后台由 Ruffle 自己的 Worker 驱动（见第 6 段），它喂给
       core 的时间戳是 performance.now()。而 core 算 dt 用的是
       「本次时间戳 − 上次时间戳」（lib.rs:1219），**没有负值保护**。
       若这里还按「只推进 1 帧」处理，vTs 会永远落在 core 的
       last_tick 之后 → dt 恒为负 → 帧累加器只减不增 → 画面彻底冻住。
       所以后台真在跑的情况下，把 vTs 直接对齐到真实时间，
       core 看到的时间戳序列是连续的，dt 恢复成 ~41ms。 */
    if (pendingAlign) {
      pendingAlign = false;
      vTs = ts; lastReal = ts; lastTs = ts;
      stallMs = 0;                       // 后台期间没有"被切断"的时间
      acc = FRAME_MS;                    // 这一帧立即放行
      resumeN++;
      alignN++;
      acc -= FRAME_MS;
      if (ts - lastNoteAt > 8000) {
        lastNoteAt = ts;
        try {
          console.warn('[MoleShell] 回到前台：后台一直在跑，时间轴已对齐真实时间'
            + '（第 ' + alignN + ' 次，无补帧、无跳变）');

      dispatch(vTs);
      return;
    }

    var raw = ts - lastReal;
    lastReal = ts;
    lastTs = ts;
    if (!(raw >= 0)) raw = 0;              // 时间戳回退（极少见）当作 0

    var step = raw;
    if (raw > RESUME_GAP_MS) {
      step = FRAME_MS;                     // 后台恢复：只走一帧
      resumeN++;
    } else if (raw > MAX_STEP_MS) {
      step = MAX_STEP_MS;                  // 单帧异常掉帧：截断
    }

    acc += step;
    if (acc < FRAME_MS) return;
    acc -= FRAME_MS;

          + ' → 只推进 1 帧，不补帧、不补定时器；累计切断 '

 * 0) 适配引擎：影片尺寸 → CSS 等比缩放 + 渲染分辨率预算
 *    必须最先执行（在 ruffle.js 之前）

(function () {

      w.style.height = mh + 'px';

       F/libc: SIGSEGV in Chrome_InProcGp ← glTexSubImage2D

  var BUDGET = 900000;

  try { BUDGET = __PIXEL_BUDGET__; } catch (e) { /* 用默认值 */ }

   * 0.4) 无损纹理回收 —— 长跑卡死的对症手段（1.0.3）
   * ---------------------------------------------------------------
   * 现象（群友反馈）：连跑一两个小时之后画面直接冻住，进程还在、日志还在刷，
   *   但画面不再更新、点哪儿都没反应。1.0.2 之前靠「显存越闸就整页重载」

   *

   *   而 CPU 侧一切正常，所以 ANR 也抓不到。

   *   WebGL 上下文被丢弃，驱动侧那块纹理内存随之归还；而 AVM2 里的游戏状态、
   *   已建立的 Socket 连接、登录态全部保留 —— 玩家看不到掉线，也看不到黑屏。
   *   抖动量仍然是 1px（1/960），且只存在一帧。
   *
   * 频率：由 Java 侧按显存闸位触发；这里再兜一层冷却，防止闸位在临界值

         也可能压根没有可用的 WebGL 上下文。这时候去抖动尺寸，

      queue.length = 0;

         转交 Java 侧落盘并静默热重启，界面不做任何提示。 */
      var rawAll = '';

        if (!keep && rawAll.indexOf('[MoleShell]') < 0) return;
      }

      for (var j = 0; j < args.length; j++) {
        var a = args[j];
        try { parts.push(typeof a === 'string' ? a : (a && a.stack ? a.stack : JSON.stringify(a))); }
        catch (e) { parts.push(String(a)); }
      }
      var line = maskIp(level + '| ' + parts.join(' '));
      enqueue(line);
      hudLine(line);
    }

    window.__moleLog = fwd;
    window.__moleHud = function (on) {
      HUD_ON = !!on;
      if (!hudEl) hudEl = document.getElementById('hud');
      if (hudEl) hudEl.className = HUD_ON ? 'on' : '';
    };
    var names = ['log', 'info', 'warn', 'error', 'debug'];
    for (var i = 0; i < names.length; i++) {
      (function (k) {
        var orig = console[k] ? console[k].bind(console) : function () {};
        console[k] = function () { fwd(k.toUpperCase(), arguments); try { orig.apply(null, arguments); } catch (e) {} };
      })(names[i]);
    }
    window.addEventListener('error', function (e) {
      fwd('JSERR', [e.message + ' @' + (e.filename || '') + ':' + (e.lineno || 0)]);
    });
    window.addEventListener('unhandledrejection', function (e) {

    });

   * 2) Ruffle 配置（ruffle.js 加载时立即读取 window.RufflePlayer.config）

<script>
/* ==================================================================
 * 5) 虚拟触控板注入（OmniPad）—— 让「鼠标悬停才弹出」的菜单在手机上能用
 * ==================================================================
 * 现象：摩尔庄园里大量菜单是「鼠标移上去才展开」，而手机只有 tap。
 *   一次触摸在浏览器里是 pointerdown/up 同帧完成，悬停态根本来不及存在，
 *   于是这些菜单在手机上等于不存在。
 *
 * 采用群友给的 OmniPad（github.com/omnipad-js/omnipad，MIT，
 * @omnipad/vanilla 0.7.3）。按仓库要求的 tag 引入方式接入，
 * 只是把 unpkg 的 UMD 与 CSS 换成本地内联（App 里没有外网 CDN）：
 *   · TargetZone      铺满舞台的靶区，把触点翻译成 canvas 上的
 *                     PointerEvent + MouseEvent，穿过 Ruffle 的
 *                     Shadow DOM；单指点哪就点哪，原有手感不变。
 *   · VirtualTrackpad 黑边里的触控板，像笔记本触摸板：
 *                     拖动 = 只移动光标（悬停菜单因此能停住），
 *                     轻点 = 在当前光标处按下并松开。
 *
 * 与游戏本体无关：画质 / 画幅 / 帧率 / 节流器 / 服务器地址一律不碰。
 * 出问题时的退路：__molePad.off() 立即拆掉图层，恢复原生触控。
 * ================================================================== */
(function () {
  var TAG = '[MoleShell]';
  function log(m) { try { console.log(TAG + ' ' + m); } catch (e) {} }

  var OP = window.OmniPad;
  var padRoot = null, stage = null, pad = null, lastKey = '';
  var MIN_MARGIN = 104;    // 黑边窄于这个值就不往里塞，改用角落浮层
  var FALLBACK_LAYOUT = { right: '10px', bottom: '10px', width: '168px', height: '112px' };
  /* 触控板默认不可见（1.0.6）。只隐藏视觉，交互区照旧 —— 见样式段注释。 */
  var padHidden = true;

  function wrapEl() { return document.getElementById('wrap'); }
  function playerEl() { return document.querySelector('ruffle-player,ruffle-embed,ruffle-object'); }
  /* Ruffle 的渲染画布在 shadow root 里，是所有合成事件的落点。
     找不到它就说明影片还没真正起画面 —— 这时候挂上去也没有意义，
     等下一轮（500ms 后）再试。OmniPad 的 Shadow DOM 穿透正是按它工作的。 */
  function canvasEl() {
    var p = playerEl();
    if (!p) return null;
    try {
      var sh = p.shadowRoot;
      return sh ? sh.querySelector('canvas') : null;
    } catch (e) { return null; }
  }

  /* ------------------------------------------------------------------
   * 5.1 触控板落脚点：优先占黑边（完全不挡画面）
   *     舞台是 960x560 等比 contain，横屏下左右黑边通常 250~330px，
   *     4:3 平板上则变成上下黑边 —— 两处都试，都没有才浮在角落。
   * ------------------------------------------------------------------ */
  function computeLayout() {
    var w = wrapEl();
    if (!w) return null;
    var r = w.getBoundingClientRect();
    if (!r || !r.width) return null;
    var vw = window.innerWidth || 1, vh = window.innerHeight || 1;
    var mR = vw - r.right, mL = r.left, mB = vh - r.bottom, mT = r.top;
    var s;

    if (mR >= MIN_MARGIN) {                       // 右侧竖条
      s = Math.round(Math.max(96, Math.min(mR - 24, 220)));
      return { right: Math.round((mR - s) / 2) + 'px', top: '30%',
               width: s + 'px', height: '40%' };
    }
    if (mL >= MIN_MARGIN) {                       // 左侧竖条
      s = Math.round(Math.max(96, Math.min(mL - 24, 220)));
      return { left: Math.round((mL - s) / 2) + 'px', top: '30%',
               width: s + 'px', height: '40%' };
    }
    if (mB >= MIN_MARGIN) {                       // 下边横条
      s = Math.round(Math.max(96, Math.min(mB - 20, 150)));
      return { bottom: Math.round((mB - s) / 2) + 'px', left: '30%',
               width: '40%', height: s + 'px' };
    }
    if (mT >= MIN_MARGIN) {                       // 上边横条
      s = Math.round(Math.max(96, Math.min(mT - 20, 150)));
      return { top: Math.round((mT - s) / 2) + 'px', left: '30%',
               width: '40%', height: s + 'px' };
    }
    return FALLBACK_LAYOUT;                       // 满屏舞台：压角落
  }

  /* 5.2 舞台尺寸变化（转屏 / 影片分辨率校正 / 分屏）后重新定位 */
  function reflow() {
    if (!pad) return;
    var lay = computeLayout();
    if (!lay) return;
    var k = JSON.stringify(lay);
    if (k === lastKey) return;
    try { pad.updateConfig({ layout: lay }); } catch (e) { return; }   // 失败就下一轮再试

   *     Java 侧 onPause 会调 element.pause()，而 Ruffle 自己的
   *     visibilitychange 回调用的是「挂起前的播放状态」，两者存在竞态：
   *     若 pause() 先跑，挂起前记录的状态就是 false，回来后不会自动 play，
   *     于是停在暂停态（还会多出个播放按钮）。
   *     这里在恢复时兜一次底：确实是暂停态就 play()，不重复开循环。
   * ------------------------------------------------------------------ */

    try { if (window.__moleFit) window.__moleFit(); } catch (e) {}

    var p = playerEl();
    if (!p) return;
    try {

        p.play();
        log('后台恢复：播放器停在暂停态，已重新 play（挂起 ' + Math.round(gapMs) + 'ms）');
      }
    } catch (e) {}
  };

     出问题时一句 __molePad.off() 就能立刻回到原生触控。 */
  window.__molePad = {
    on: function () { return OP ? mount() : false; },
    off: function () {
      try { if (padRoot && padRoot.parentNode) padRoot.parentNode.removeChild(padRoot); } catch (e) {}

      log('OmniPad 已拆除，恢复原生触控');
      return true;
    },

       两种状态下拖动手势、轻点确认、虚拟光标行为完全一致。 */
    trackpad: function (v) {
      padHidden = !(v === 'on' || v === true || v === 1);
      if (padRoot) {
        try { padRoot.className = padHidden ? 'pad-invisible' : ''; } catch (e) {}
      }
      log('触控板视觉 ' + (padHidden ? '已隐藏（交互保留）' : '已恢复显示'));
      return padHidden;
    },
    state: function () {
      return { mounted: !!padRoot, layout: lastKey, omni: !!OP,
               trackpadVisible: !padHidden };
    }
  };

  if (!OP || typeof OP.TargetZone !== 'function' || typeof OP.VirtualTrackpad !== 'function') {
    log('OmniPad 未装载（内核过旧或脚本未执行），保留原生触控，不影响游玩');
    return;
  }

  /* 5.4 挂载：等 Ruffle 的播放器元素真正出现再建图层 */
  function mount() {
    if (padRoot) return true;
    if (!OP) return false;
    if (!wrapEl() || !playerEl()) return false;
    if (!canvasEl()) return false;      // 有播放器还没画布：还没起画面，下一轮再试

    padRoot = document.createElement('div');
    padRoot.id = 'pad';
    if (padHidden) padRoot.className = 'pad-invisible';
    document.body.appendChild(padRoot);

    /* 靶区：严格吸附在舞台上，坐标换算用它的 getBoundingClientRect，
       所以舞台被 CSS transform 缩放后依然精确。 */
    stage = new OP.TargetZone(padRoot, {
      widgetId: '$stage',
      cursorEnabled: true,
      layout: { stickySelector: '#wrap' }
    });

    var lay = computeLayout() || FALLBACK_LAYOUT;
    pad = new OP.VirtualTrackpad(padRoot, {
      widgetId: '$pad',
      label: '拖动·轻点',
      targetStageId: '$stage',
      mapping: { type: 'mouse', button: 0 },
      /* 满幅拖动 ≈ 舞台宽度的 60%：够快，又能落在小按钮上 */
      sensitivity: 0.6,
      layout: lay
    });
    lastKey = JSON.stringify(lay);
    log('OmniPad 已挂载：舞台靶区 + 触控板 ' + lastKey);
    return true;
  }

  var tries = 0;
  var wait = setInterval(function () {
    tries++;
    if (mount()) {
      clearInterval(wait);
      setInterval(reflow, 1000);      // 转屏 / 分辨率校正后重新贴边
    } else if (tries >= 60) {         // 30s 仍未就绪：放弃，不影响游戏
      clearInterval(wait);
      log('OmniPad 放弃挂载：30s 内未等到「播放器 + 画布」'
        + '（有播放器=' + !!playerEl() + '，有画布=' + !!canvasEl() + '），保持原生触控');
    }
  }, 500);
})();

/* ==================================================================
 * 6) 后台保活 —— 切后台不暂停，游戏在后台继续跑
 * ==================================================================
 * 现象（群友反馈）：切到后台再回来，服务器收到一批**时间顺序对不上**
 *   的数据包，随即被踢下线。
 *
 * 根因（Ruffle 源码实证，ruffle.js 内联 bundle）：
 *   setupTabVisibilityHandling() 里
 *     let A = this.loadedConfig?.backgroundExecutionMode ?? vA.None;
 *     document.hidden
 *       ? (A===MainThread ? (enable_background_tick_mode(),
 *                            lastActivePlayingState && startBackgroundTick())
 *                         : this.instance.pause())
 * 也就是说这条分支走哪边**完全由配置决定**。壳层原来把
 * backgroundExecutionMode 写成 'none'，于是页面一 hidden 就 pause()：
 *   · 游戏逻辑冻结，会话还挂着（不发心跳、不动时间轴）
 *   · 回来时 lib.rs 的 dt = 当前时间戳 − 上次时间戳 = 挂起时长
 *   · player.rs 的 frame_accumulator += dt 后连跑 5 帧
 *     （max_frames_per_tick），timer.rs 再把所有到期定时器补跑一遍
 *     （MAX_TICKS=10）
 *   · 游戏把积压逻辑一次性做完，每个包都带着跳变后的时间戳
 *   → 服务器看到的正是「时间倒挂 / 顺序错乱」。
 *
 * 解法：配置改成 'mainThread'（第 2 段），让 Ruffle 走官方那条
 *   「后台继续 tick」的路径：它自己起一个 Web Worker，里面按影片帧率
 *   （24fps）setTimeout 调 instance.tick_for_background(performance.now())。
 *   Worker 的定时器不受页面可见性节流，所以后台**真的在按 24fps 跑**，
 *   客户端时间轴与真实时间始终连续 —— 没有积压，也就没有补帧。
 *
 * 本段只做三件 Ruffle 自己没做好的事：
 *   ① startBackgroundTick 不判重：它自己的 visibilitychange 分支和
 *      我们的兜底都会去调，重复调用会 new 出第二个 Worker，
 *      两个 Worker 各推 24fps → 游戏两倍速。这里包成幂等。
 *   ② 兜底接管：极少数 WebView 在 Activity 不可见时不派发
 *      visibilitychange（document.hidden 一直是 false），那样 Ruffle
 *      永远等不到 hidden 分支。此时由 Java 的 onPause → __moleEnterBackground
 *      代劳一次。
 *   ③ 时间轴对齐：后台喂给 core 的是 performance.now()，而前台喂的是
 *      第 0 段的虚拟时间轴 vTs。回来时不把 vTs 对齐，core 算出的
 *      dt 会恒为负（lib.rs:1219 没有负值保护）→ 帧累加器只减不增
 *      → 画面彻底冻住。所以「后台真跑过」之后必须对齐。
 *
 * 与游戏本体无关：帧率 / 画质 / 画幅 / 服务器地址一律不碰。
 * ================================================================== */
(function () {
  var TAG = '[MoleShell]';
  function log(m) { try { console.log(TAG + ' ' + m); } catch (e) {} }

  /* 后台「真的跑过一程」的证据。只有它为真才允许对齐时间轴：
     没跑过就对齐，等于把挂起时长原样喂给 core，那才是补帧风暴。 */
  var bgSeen = false;

  function playerEl() { return document.querySelector('ruffle-player,ruffle-embed,ruffle-object'); }

  /* Ruffle 的 startBackgroundTick / stopBackgroundTick 都挂在原型上，
     实例上覆盖一次就行，且顺便把「跑过」这件事记下来 ——
     Ruffle 自己的 visible 分支会先 stopBackgroundTick，等我们反应过来
     backgroundWorker 已经是 null 了，只有拦在方法里才抓得住。 */
  function patch(p) {
    if (!p || p.__moleBgPatched) return;
    try {
      if (typeof p.startBackgroundTick === 'function') {
        var origStart = p.startBackgroundTick;
        p.startBackgroundTick = function () {
          if (this.backgroundWorker) { bgSeen = true; return; }   // 已有在跑，别开第二个
          var r = origStart.apply(this, arguments);
          if (this.backgroundWorker) bgSeen = true;
          return r;
        };
      }
      if (typeof p.stopBackgroundTick === 'function') {
        var origStop = p.stopBackgroundTick;
        p.stopBackgroundTick = function () {
          if (this.backgroundWorker) bgSeen = true;               // 停之前确实在跑
          return origStop.apply(this, arguments);
        };
      }
      p.__moleBgPatched = 1;
    } catch (e) {}
  }

  /* 页面可见性变化时顺手 patch —— Ruffle 的 player 可能比本段晚创建 */
  document.addEventListener('visibilitychange', function () {
    try { patch(playerEl()); } catch (e) {}
  }, true);

  /* Java onPause → 这里。幂等，重复调用无副作用。 */
  window.__moleEnterBackground = function () {
    var p = playerEl();
    if (!p || !p.instance) return false;
    patch(p);
    if (p.backgroundWorker) { bgSeen = true; return true; }   // Ruffle 已接管
    if (document.hidden) return false;      // 正在 hidden：等它自己的分支跑，别抢

    /* 走到这里说明 WebView 没派发 visibilitychange（或派发前就被叫来了）。
       代劳一次 Ruffle 的 hidden 分支。游戏本来就是暂停态时什么都不做 ——
       后台不需要为「已经暂停的游戏」维持时间轴。 */
    try {
      var playing = p.instance.is_playing();
      p.lastActivePlayingState = playing;
      if (!playing) return false;
      p.instance.enable_background_tick_mode();
      p.startBackgroundTick();
      log('visibility 未变，已手动接管后台运行（Worker='
        + !!p.backgroundWorker + '）');
      return !!p.backgroundWorker;
    } catch (e) {
      log('手动接管后台运行失败：' + e);
      return false;
    }
  };

  /* Java onResume → 这里。 */
  window.__moleLeaveBackground = function () {
    var p = playerEl();
    var worker = false;
    try { worker = !!(p && p.backgroundWorker); } catch (e) {}

    if (worker) {
      /* Ruffle 的 visible 分支没跑（否则 worker 已经被它 stop 掉了），
         我们代劳：停 Worker → 恢复动画循环 → 必要的 play。
         注意不能无条件 restart_animation_loop：Ruffle 的 visible 分支
         已经 restart 过一次，再调一次会多登记一个 rAF 回调，
         游戏就变双倍速了。 */
      try { p.stopBackgroundTick(); } catch (e) {}
      try { if (p.instance) p.instance.restart_animation_loop(); } catch (e) {}
      try {
        if (p.lastActivePlayingState && p.instance && !p.instance.is_playing()) {
          p.instance.play();
        }
      } catch (e) {}
      log('回到前台：已接管恢复（Worker 已停）');
    }

    var aligned = false;
    if (bgSeen) {
      try { aligned = window.__moleAlignClock() === true; } catch (e) {}
      if (aligned) {
        log('回到前台：后台一直在跑，时间轴对齐真实时间（不补帧、不跳变）');
      }
    }
    var r = { worker: worker, ranInBackground: bgSeen, aligned: aligned };
    bgSeen = false;
    return r;
  };

  /* 诊断口子 */
  window.__moleBg = function () {
    var p = playerEl();
    return { hidden: !!document.hidden, ran: bgSeen,
             worker: !!(p && p.backgroundWorker),
             playing: !!(p && p.instance && p.instance.is_playing()) };
  };
})();
</script>
</body>
</html>
